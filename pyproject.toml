[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probtrunc_extraction"
version = "0.1.0"
description = "Model extraction attacks against fixed-point neural networks with probabilistic truncation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0.2,<3",
    "scipy>=1.16.3,<2",
    "scikit-learn>=1.6.1,<2",
    "sympy>=1.14,<2",
    "threadpoolctl>=3.7,<4",
]

[project.optional-dependencies]
emax = [
    "torch>=2.1,<3",
    "matplotlib>=3.10,<4",
]
fpylll = [
    "cysignals>=1.12.6,<2",
    "fpylll>=0.6.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
